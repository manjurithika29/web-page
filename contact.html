    <h2>Send Us a Message</h2>

    <p>Use this sample form to practise HTML form elements.</p>

    <form>
        <label>Name:</label>
        <input type="text" required>
        <br><br>

        <label>Email:</label>
        <input type="email" required>
        <br><br>

        <label>Pet Type:</label>
        <select>
            <option>Dog</option>
            <option>Cat</option>
            <option>Bird</option>
            <option>Other</option>
        </select>
        <br><br>

        <label>Message:</label>
        <textarea rows="4" cols="30"></textarea>
        <br><br>

        <input type="submit" value="Send Message">
    </form>
